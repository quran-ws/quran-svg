# Mirror a release to cdn.quran.ws/svg/pages/. Versions are immutable: this runs once per
# release and refuses to overwrite a folder that already exists.
name: publish-cdn

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v1.1.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The R2 credentials live in this environment, not in repo secrets, so only a run
    # started from a release — and approved — can reach them.
    environment: cdn
    permissions:
      contents: read
    steps:
      # Only the scripts are needed. Every file published comes from the release, and a
      # full checkout of this repository is several gigabytes.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'cdn-quran-ws' }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: ./scripts/publish-cdn.sh "$VERSION"

      - name: Check it is live
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          base="https://cdn.quran.ws/svg/pages/$VERSION"
          curl -fsS "$base/manifest.json" -o /tmp/m.json

          # a page: CORS must be present, and the bytes must match the manifest digest.
          # The Origin header is required — R2 only emits the CORS headers in response to one.
          curl -fsS --compressed -H 'Origin: https://example.com' -o /tmp/p.svg -D /tmp/h "$base/hafs-kfqc/001.svg"
          grep -qi '^access-control-allow-origin' /tmp/h || { echo "no CORS header"; exit 1; }
          want=$(jq -r '.files[]|select(.name=="hafs-kfqc/001.svg")|.sha256' /tmp/m.json)
          got=$(sha256sum /tmp/p.svg | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "hafs-kfqc/001.svg digest mismatch"; exit 1; }

          got=$(curl -fsS "https://cdn.quran.ws/svg/pages/latest.json" | jq -r .version)
          [ "$got" = "$VERSION" ] || { echo "latest.json names '$got', expected '$VERSION'"; exit 1; }

          echo "$(jq '.files|length' /tmp/m.json) objects, digest and latest all ok"
